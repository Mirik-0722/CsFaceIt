services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: csfaceit
      POSTGRES_USER: ${DB_USER:-csfaceit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-csfaceit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
