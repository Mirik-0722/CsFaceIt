server {
    listen 80;
    server_name _;

    # Redirects Nginx issues itself (for example /api to /api/) stay relative, so they keep the published host port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Text assets only; the woff2 fonts and other binaries are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # The only thing proxied. The URI is passed through unchanged, so /api/v1/... reaches the backend as /api/v1/....
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port the browser used; without it Spring sees a Host that differs from the Origin of a
        # same-origin POST and treats the request as cross-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these file names, so a changed file always gets a new URL and may be cached for good.
    # A missing file is a real 404; falling back to index.html would serve HTML where a script or stylesheet is expected.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point must be revalidated on every load, or a deploy would keep serving the old bundle names.
    # Client-side routes fall back to this location through the internal redirect below.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
