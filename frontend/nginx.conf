server {
    listen 80;
    server_name _;

    # Redirects Nginx issues itself (for example /api to /api/) stay relative, so they keep the published host port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Text assets only; the woff2 fonts and other binaries are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # The manual demo upload: a .dem is large, and everything else under /api/ keeps Nginx's default body limit of 1 MB.
    # The regex (quoted, because it contains braces) wins over the /api/ prefix below. The body is streamed to the
    # backend instead of being buffered in a temp file first, and the timeouts are long because the backend answers
    # only once the whole file is stored. The backend limits an upload on its own (DEMO_UPLOAD_MAX_SIZE, 413 with a
    # JSON body); this limit is the one of Nginx, so keep the two in step.
    location ~ "^/api/v1/matches/[A-Za-z0-9-]{1,64}/demo/upload$" {
        client_max_body_size 1g;
        # Nginx's own 413 gets the same JSON body as the backend's.
        error_page 413 @upload_too_large;
        proxy_request_buffering off;
        # Without HTTP/1.1 towards the backend Nginx buffers a chunked request body regardless.
        proxy_http_version 1.1;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://backend:8080;
        # Identical to the /api/ location below.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The upload of a recorder: the video of a clip (an MP4, up to CLIP_UPLOAD_MAX_SIZE) and its thumbnail. Everything
    # else of the recorder's API is small and keeps the default body limit, with the /api/ location below. The same as
    # the demo upload above: streamed and not buffered, long timeouts because the backend answers once the file is
    # stored, and Nginx's own 413 with the JSON body of the backend's. The backend limits an upload on its own
    # (CLIP_UPLOAD_MAX_SIZE); this limit is the one of Nginx, so keep the two in step.
    location ~ "^/api/worker/v1/clips/[0-9]+/(video|thumbnail)$" {
        client_max_body_size 1g;
        error_page 413 @upload_too_large;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://backend:8080;
        # Identical to the /api/ location below.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @upload_too_large {
        default_type application/json;
        return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"The uploaded file is larger than the allowed size"}';
    }

    # The video of a clip, played by a <video> element: a file of tens of megabytes that the browser reads in ranges and
    # drops half way whenever it seeks. With the buffering off Nginx takes the bytes from the backend only as fast as the
    # browser takes them from Nginx. With it on (the default) Nginx would draw the whole answer from the backend at once
    # and keep it in memory and in a temp file for a browser that reads slowly or stops half way. The Range header
    # reaches the backend with the other request headers, and its 206 comes back unchanged.
    location ~ ^/api/v1/clips/[0-9]+/video$ {
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://backend:8080;
        # Identical to the /api/ location below.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The only thing else proxied. The URI is passed through unchanged, so /api/v1/... reaches the backend as /api/v1/....
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port the browser used; without it Spring sees a Host that differs from the Origin of a
        # same-origin POST and treats the request as cross-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these file names, so a changed file always gets a new URL and may be cached for good.
    # A missing file is a real 404; falling back to index.html would serve HTML where a script or stylesheet is expected.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point must be revalidated on every load, or a deploy would keep serving the old bundle names.
    # Client-side routes fall back to this location through the internal redirect below.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
