# Runs the whole stack without a FACEIT API key: the backend talks to a WireMock server that plays FACEIT.
#
#   docker compose -f docker-compose.yml -f docker-compose.fake.yml up -d --build --wait
#
# See dev/fake-faceit/README.md for what the fake serves. This file only adds what differs from docker-compose.yml.
services:
  fake-faceit:
    # Pinned to an exact version so the fake behaves the same everywhere.
    image: wiremock/wiremock:3.13.2
    # Published for local development only, and only on the loopback interface. The host port is a variable because the
    # backend has to tell the browser where the fake Steam is (AUTH_STEAM_LOGIN_URL below): set FAKE_FACEIT_PORT to
    # publish it elsewhere and both follow. A port mapping of another file that replaces this one has to set it too.
    ports:
      - "127.0.0.1:${FAKE_FACEIT_PORT:-8089}:8080"
    volumes:
      # WireMock reads its stubs from mappings/ and its response files from __files/ under /home/wiremock.
      - ./dev/fake-faceit:/home/wiremock:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    environment:
      FACEIT_BASE_URL: http://fake-faceit:8080
      # Any non-blank value: the backend refuses to start without one, the fake does not check it.
      FACEIT_API_KEY: fake
      # The fake plays FACEIT's Downloads API too, so that the import goes the way it goes with real access: it asks the fake
      # for a signed address and downloads from that. The token is a made-up one that the fake checks; it is written out here
      # and not read from the environment, so that a real FACEIT_DOWNLOADS_TOKEN of your .env never reaches the fake. To try
      # the import without access, override it with an empty value (FACEIT_DOWNLOADS_TOKEN: "" in a file of your own).
      FACEIT_DOWNLOADS_URL: http://fake-faceit:8080/download/v2/demos/download
      FACEIT_DOWNLOADS_TOKEN: fake-downloads-token
      # A pasted demo link may lead to the fake only (dev/fake-faceit/README.md, "Demo links"). The fake is on this
      # network's private addresses, which a link may never reach on a server: DEMO_LINK_PRIVATE_HOSTS lets this one
      # name through that last check, and the backend says so with a WARN at startup. Both are written out here and not
      # read from the environment, so that the main file's list and a server's settings stay as they are.
      DEMO_LINK_ALLOWED_ORIGINS: http://fake-faceit:8080
      DEMO_LINK_PRIVATE_HOSTS: fake-faceit
      # Admin key of the demo stack (the X-API-Key header); override it by setting APP_API_KEY.
      APP_API_KEY: ${APP_API_KEY:-dev-admin-key}
      # Worker token of the demo stack (the X-Worker-Token header of a recorder); override it by setting CLIP_WORKER_TOKEN.
      CLIP_WORKER_TOKEN: ${CLIP_WORKER_TOKEN:-dev-worker-token}
      # A fake Steam as well: the same WireMock plays it (dev/fake-faceit/README.md), and "Sign in with Steam" signs in as
      # the player s1mple without a Steam account. The browser is sent to the login address on the published port of
      # the fake, which is the address it can reach; the backend confirms the answer at the address the fake has inside
      # this network. They are two addresses of one server, which is what the two settings are for. Never use this on a
      # server: whoever reaches the fake can sign in as anybody.
      AUTH_STEAM_LOGIN_URL: http://localhost:${FAKE_FACEIT_PORT:-8089}/steam/openid/login
      AUTH_STEAM_VERIFY_URL: http://fake-faceit:8080/steam/openid/login
    depends_on:
      fake-faceit:
        condition: service_healthy

  frontend:
    # The override ships a publicly documented admin key, so the web port is not reachable from the LAN in this mode.
    # !override replaces the mapping of docker-compose.yml instead of adding a second one.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:80"

  recorder-fake:
    # The recorder in its fake recording mode. It takes the queued clips from the backend, makes a test pattern with
    # ffmpeg instead of playing the demo, and uploads the result, so that the whole chain from the queue to the player
    # can be tried without a game. It only calls the worker API of the backend and serves nothing, so it has no port.
    # See recorder/README.md.
    build: ./recorder
    environment:
      BACKEND_URL: http://backend:8080
      # The secret of the worker API: the same variable and default as the backend's, so that the two agree.
      CLIP_WORKER_TOKEN: ${CLIP_WORKER_TOKEN:-dev-worker-token}
      RECORDER_MODE: fake
      WORKER_NAME: fake-1
      # Seconds of video made per second of wall time. 1 is real time: a clip of ten seconds takes ten, long enough to
      # watch it go from state to state. 0 is as fast as ffmpeg can go.
      FAKE_SPEED: ${FAKE_SPEED:-1}
    volumes:
      # The demos it has downloaded, so that a recreated container does not download them again.
      - recorder-work:/work
    depends_on:
      backend:
        condition: service_healthy
    # Started again after a crash, like the parser. A stop gives the clip it holds back to the queue at once.
    restart: unless-stopped

volumes:
  recorder-work:
