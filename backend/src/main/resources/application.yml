spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/csfaceit}
    username: ${DB_USER:csfaceit}
    password: ${DB_PASSWORD:csfaceit}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  # A manual demo upload is a multipart request; the one size below limits both the file and the whole request. Beyond
  # it the API answers 413 with PAYLOAD_TOO_LARGE (see ApiExceptionHandler).
  servlet.multipart:
    max-file-size: ${demo.upload.max-size}
    max-request-size: ${demo.upload.max-size}
  # The scheduled jobs (the daily clean-ups of old demo files and old clips, the check for clips whose recorder has gone
  # quiet, the read of the clip gauges) share one scheduler, whose default is a single thread. With two, the check that
  # has to run every 30 seconds does not wait behind a clean-up that takes minutes.
  task.scheduling.pool.size: 2
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    # The FACEIT cache is best effort, so Redis must fail fast; Lettuce's default command timeout is 60 s.
    timeout: 500ms
    connect-timeout: 500ms
  # The connection is made on first use, so the backend starts while the broker is still coming up. The timeouts keep a
  # request thread from hanging on a broker that is unreachable (connection-timeout) or that accepts connections but
  # stops answering (channel-rpc-timeout bounds the broker's replies to calls such as opening a channel or declaring a
  # queue, which default to 10 minutes; reply-timeout bounds a send that waits for a reply).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
    channel-rpc-timeout: 5s
    template.reply-timeout: 5s
    # A listener handles one message at a time and can take minutes (a demo download), so it must not reserve more.
    listener.simple.prefetch: 1
faceit:
  base-url: ${FACEIT_BASE_URL:https://open.faceit.com/data/v4}
  api-key: ${FACEIT_API_KEY}
  connect-timeout: 5s
  read-timeout: 10s
  # FACEIT's history endpoint answers only the last month unless a "from" timestamp is sent; this is how far back it reaches.
  history-lookback: ${FACEIT_HISTORY_LOOKBACK:365d}
  retry: { max-attempts: 3, initial-backoff: 200ms, multiplier: 2.0 }
  # FACEIT's Downloads API, the only way to get a demo file: the demo_url of a match is a private cloud address that does not
  # resolve outside FACEIT. Access is applied for at FACEIT (https://fce.gg/downloads-api-application) and comes as an
  # access token of its own, which is not the Data API key above. With a token the import asks this endpoint for a signed
  # address and downloads from that; without one it fetches demo_url as it is, which works for a host that really serves the
  # file and otherwise fails the demo at once with the code DOWNLOAD_NEEDS_ACCESS. The stack without a FACEIT key points the
  # url at its fake. Neither value is logged.
  downloads:
    token: ${FACEIT_DOWNLOADS_TOKEN:}
    url: ${FACEIT_DOWNLOADS_URL:https://open.faceit.com/download/v2/demos/download}
  cache: { player-ttl: 5m, history-ttl: 2m, match-ttl: 24h, unfinished-match-ttl: 30s, stale-ttl: 7d }
app:
  security.api-key: ${APP_API_KEY}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # The origin the visitors reach the site at when it is none of the origins above, such as http://203.0.113.5 for a server
  # that has no domain (an origin is the scheme, the host and the port when it is not the default one, with no path). The
  # known origins of the site (auth/KnownOrigins) are the CORS list plus this one: a sign-in is served, and a write that
  # carries a session cookie is accepted, only at one of them. Empty when unset.
  public-origin: ${PUBLIC_ORIGIN:}
# Signing in (auth/AuthProperties). A visitor signs in with Steam (OpenID 2.0: no key, no registration) and the site then
# looks for their FACEIT player by the SteamID. The session lives in a cookie for session-lifetime and use does not extend
# it; the address Steam sends the visitor back to is the one the browser used, provided that it is one of the known origins
# of app.* above, so nothing in this block names the site. A signed-in player may, without the admin key (APP_API_KEY),
# bring the demo of a match they played and order, retry and delete their own clips (auth/Access has the rules); an
# administrator's session does what the key does.
auth:
  steam:
    # Where the browser is sent to sign in, and where the backend posts the answer back to have Steam confirm it. Both are
    # Steam's own address; the stack without a FACEIT key (docker-compose.fake.yml) points them at its fake Steam instead,
    # which is why they are two settings: the browser and the backend reach that one at different addresses. The identity
    # in the answer has to be Steam's own (https://steamcommunity.com/openid/id/<17 digits>) in every environment.
    login-url: ${AUTH_STEAM_LOGIN_URL:https://steamcommunity.com/openid/login}
    verify-url: ${AUTH_STEAM_VERIFY_URL:https://steamcommunity.com/openid/login}
  # The SteamID64s (17 digits, comma separated) of the people who get the role ADMIN when they sign in; every other
  # visitor is a USER. The list is read at every request (the effective role, which /api/v1/auth/me shows), not only at
  # the sign-in: a SteamID taken off it is a USER again after the restart, with the cookie it has.
  admin-steam-ids: ${AUTH_ADMIN_STEAM_IDS:}
  # The FACEIT OAuth application. The sign-in with FACEIT is meant to be on only while a client id is set, but its flow is
  # not written yet: /api/v1/auth/providers answers `faceit: false` whatever is set here (AuthController says why), and the
  # flow's endpoints answer 404, as for a provider that is off. Neither value is logged.
  faceit:
    client-id: ${FACEIT_OAUTH_CLIENT_ID:}
    client-secret: ${FACEIT_OAUTH_CLIENT_SECRET:}
  # How long a session lasts from the moment it is made. A plain value, like the thresholds of the analysis: not part of .env.
  session-lifetime: 30d
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  # Redis is a best-effort cache here, so an outage must not turn /actuator/health (the container HEALTHCHECK) DOWN.
  health.redis.enabled: false
  # Likewise RabbitMQ only serves the demo import: with the broker down the rest of the API still works, so its outage
  # must not turn /actuator/health DOWN either (the broker is also unreachable for a moment whenever it restarts).
  health.rabbit.enabled: false
# Where the demo files are kept: type "local" (a directory, for development) or "minio" (S3-compatible, the compose stack).
storage:
  type: ${STORAGE_TYPE:local}
  local-dir: ${STORAGE_LOCAL_DIR:./data/storage}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:csfaceit}
demo:
  download:
    connect-timeout: 5s
    # How long a download may stall: the longest silence between two reads of the response, not the whole transfer.
    read-timeout: 120s
    # The most a download may transfer, and the most a gzip demo may expand to.
    max-size: 1GB
  upload:
    # The most a manual upload may be, and the most a gzip upload may expand to. Nginx has a limit of its own for the
    # upload path (frontend/nginx.conf); keep the two in step.
    max-size: ${DEMO_UPLOAD_MAX_SIZE:1GB}
  # Before a parsed demo is analyzed, its players are compared with the roster of the match (analysis/RosterCheck), so
  # that a file of another game cannot replace the statistics and the highlights of the match. Of the roster's players
  # whose SteamID FACEIT gives, at least this share (from 0 to 1) has to be among the players of the demo, or the demo
  # is FAILED with the code WRONG_MATCH. A roster with fewer than 6 known SteamIDs is not checked at all. A plain value,
  # like the thresholds of the analysis below, checked when the backend starts; 0 switches the check off.
  match-check:
    min-share: 0.8
  # Stored demo files older than this many days are removed by a job that runs once a day (DemoRetentionJob); the parsed
  # facts in the database stay. 0 switches the job off. The cron expression (Spring's six fields, server time) is
  # normally left alone.
  retention-days: ${DEMO_RETENTION_DAYS:30}
  retention-cron: ${DEMO_RETENTION_CRON:0 0 4 * * *}
# The thresholds of the analysis of a parsed demo (analysis/AnalysisProperties). All of them are positive numbers of
# seconds, checked when the backend starts. They are plain values, not ${VARIABLE:default} placeholders and not part of
# .env: a change here is a change of the rules (an environment variable such as ANALYSIS_TRADE_WINDOW_SECONDS still
# overrides one, by Spring's relaxed binding).
analysis:
  # A highlight clip starts this long before the first tick of the highlight and ends this long after the last one.
  clip:
    pre-seconds: 3
    post-seconds: 2
  # A kill is a trade when the killer's teammate was killed this recently (and the kill is of the teammate's killer).
  trade-window-seconds: 5
  # How long a defuse takes in the rules of the ninja defuse highlight.
  ninja:
    defuse-seconds: 10
# Video clips (clip/ClipProperties): the queue of clips waiting for a recorder, the rules that cut a clip into segments,
# and how long a finished clip is kept. Checked when the backend starts: a count, a time span or a size that is not
# positive is refused (retention-days may be 0).
clip:
  # The secret a recorder sends in X-Worker-Token. While it is empty every request of a recorder is refused. It is never
  # logged and has no default here.
  worker-token: ${CLIP_WORKER_TOKEN:}
  # Frames per second of a recording, whatever its quality.
  fps: 60
  # A segment of a clip starts this long before a kill of the player and ends this long after it ...
  pre-seconds: 3
  post-seconds: 2
  # ... and two segments that are less than this far apart are one segment.
  merge-gap-seconds: 4
  # The most the segments of one clip may add up to; a request for a longer clip is answered with 409 CLIP_TOO_LONG.
  max-duration-seconds: 300
  # How many clips may wait in the queue; a request beyond it is answered with 429 CLIP_QUEUE_FULL. A soft limit: two
  # requests at the limit at the same moment may both get in.
  max-queued: 50
  # How many times a clip is recorded before it is given up (it then ends FAILED).
  max-attempts: 3
  # An active clip whose recorder has said nothing for this long is taken back from it.
  stale-after: 3m
  # A recorder seen this recently counts as online.
  worker-online-within: 90s
  # Once a day (retention-cron) a job deletes the clips that finished, done or failed, more than this many days ago, with
  # the video and thumbnail files of every attempt to record them; 0 switches the job off and keeps every clip. The cron
  # expression (Spring's six fields, server time) is normally left alone.
  retention-days: ${CLIP_RETENTION_DAYS:30}
  retention-cron: ${CLIP_RETENTION_CRON:0 30 4 * * *}
  # The most a recorder may upload for one clip (the video and the thumbnail each). Nginx has a limit of its own for the
  # upload path (frontend/nginx.conf); keep the two in step.
  upload-max-size: ${CLIP_UPLOAD_MAX_SIZE:1GB}
